<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registeration Form</title>
</head>

<body>
    <style>
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        body {
            background-color: darkkhaki;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        h1 {
            animation: fadeInDown 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        div {
            background-color: burlywood;
            height: auto;
            min-height: 590px;
            width: 550px;
            border: 2px solid black;
            border-radius: 50px;
            margin: 20px auto;
            padding: 30px 40px;
            box-sizing: border-box;
            text-align: justify;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: cardAppear 0.9s cubic-bezier(0.25, 1, 0.5, 1);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        div:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        label {
            font-size: 22px;
            color: rgb(3, 53, 30);
        }

        input {
            border-radius: 10px;
            height: 25px;
            border: 1px solid #777;
            padding: 2px 8px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        input[type="email"],
        input[type="password"] {
            width: 200px;
        }

        input:focus {
            border-color: green;
            box-shadow: 0 0 8px rgba(0, 128, 0, 0.6);
            transform: scale(1.03);
        }

        input[type="radio"] {
            cursor: pointer;
            transform: scale(1.2);
            transition: transform 0.2s ease;
            margin-right: 4px;
        }

        input[type="radio"]:hover {
            transform: scale(1.4);
        }

        #fdep {
            color: rgb(82, 117, 20);
        }

        .submit {
            width: 110px;
            height: 42px;
            font-size: 20px;
            margin-left: 30px;
            margin-top: 10px;
            border-radius: 10px;
            background-color: green;
            border: 2px solid green;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
        }

        .submit:hover {
            background-color: darkgreen;
            border-color: darkgreen;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.25);
        }

        .submit:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type="reset"].submit {
            background-color: #c0392b;
            border-color: #c0392b;
        }

        input[type="reset"].submit:hover {
            background-color: #a93226;
            border-color: #a93226;
        }
    </style>
    <h1>Student Registeration Form</h1>
    <div>
    <form>
        <label>Name :</label>
        <input type="text" id="fname"><br><br>
        <label>D.O.B :</label>
        <input type="date" id="fdob"><br><br>
        <label>Gender :</label>
        <input type="radio" id="gen-male" name="gender" value="male">
        <label for="gen-male">Male</label>
        <input type="radio" id="gen-female" name="gender" value="female">
        <label for="gen-female">Female</label>
        <input type="radio" id="gen-other" name="gender" value="other">
        <label>Other</label><br><br>
        <label>Phone :</label>
        <input type="number" id="fph"><br><br>
        <label>Address :</label>
        <input type="text" id="faddr"><br><br>
        <label>Email :</label>
        <input type="email" id="fmail"><br><br>
        <label>Password :</label>
        <input type="password" id="fpass"><br><br>
        <label>Department :</label><br>
        <input type="radio" id="fdep" name="fdep">computer Science<br>
        <input type="radio" id="fdep" name="fdep">ECE<br>
        <input type="radio" id="fdep" name="fdep">IT<br>
        <input type="radio" id="fdep" name="fdep">EEE<br>
        <input type="radio" id="fdep" name="fdep">Mechanical<br><br>
        <input type="submit"class="submit" value="Submit">
        <input type="reset" class="submit" value="Clear">
    </form>
    </div>
</body>

</html>
